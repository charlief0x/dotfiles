# Starship — Dracula Pro
# https://draculatheme.com/pro
#
# Switch themes by changing the palette name below.
# Available: dracula_pro, dracula_blade, dracula_buffy, dracula_lincoln,
#            dracula_morbius, dracula_van_helsing, dracula_alucard

palette = "dracula_pro"

format = "$directory$git_branch$git_status$python${custom.userhost}$sudo$character"
right_format = "$cmd_duration$status$aws$time"
add_newline = false

[aws]
symbol = " "
format = "[$symbol($profile)(\\($region\\))]($style) "
style = "bold orange"

[directory]
truncation_length = 1
truncate_to_repo = false
read_only = "🔒"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
conflicted = "⚡${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = " "
format = "[$symbol(${version})( \\($virtualenv\\))]($style) "
style = "bold pink"

[username]
disabled = true

[hostname]
disabled = true

[custom.userhost]
command = "echo ${USER}@$(hostname -s)"
when = '{ [ -n "$SSH_CLIENT" ] && [ -z "$TMUX" ]; } || [ "$EUID" -eq 0 ]'
format = "[$output]($style) "
style = "bold green"

[sudo]
symbol = "💀"
disabled = false
format = "[$symbol]($style)"
style = "bold red"

[status]
disabled = false
format = "[$status]($style) "
style = "bold red"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❱](bold green) "
error_symbol = "[❱](bold red) "
format = "$symbol"

[time]
disabled = false
format = " [$time]($style)"
time_format = "%H:%M %Y-%m-%d"
style = "comment"

# ---------------------------------------------------------------------------
# Palettes
# Dark variants share the same accent colors; only the terminal background
# colour differs (set in your terminal emulator, not here).
# ---------------------------------------------------------------------------

