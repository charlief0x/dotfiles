bind-key J command-prompt -p "ssh host>" "new-window -n %1 'ssh %1'"
bind-key z command-prompt "new-window -n root 'sudo $SHELL'"


# Left: SSH indicator (shown only in SSH sessions) + hostname pill + session pill
set -g   status-left "#{?#{@ssh_active},#[fg=#{@thm_teal}#,bg=#{@thm_mantle}]#[fg=#{@thm_crust}#,bg=#{@thm_teal}] SSH #[fg=#{@thm_teal}#,bg=#{@thm_mantle}],}"
set -agF status-left "#[fg=#{@pill_hostname},bg=#{@thm_mantle}]"
set -agF status-left "#[fg=#{@thm_crust},bg=#{@pill_hostname}] ##H "
set -agF status-left "#[fg=#{@pill_hostname},bg=#{@thm_mantle}]"
set -agF status-left "#[fg=#{@pill_username},bg=#{@thm_mantle}]"
set -agF status-left "#[fg=#{@thm_crust},bg=#{@pill_username}] #{user} "
set -agF status-left "#[fg=#{@pill_username},bg=#{@thm_mantle}]"
set -agF status-left "#[fg=#{@pill_session},bg=#{@thm_mantle}]"
set -agF status-left "#[fg=#{@thm_crust},bg=#{@pill_session}] ##S "
set -agF status-left "#[fg=#{@pill_session},bg=#{@thm_mantle}]"

# Right: datetime pill
set -gF  status-right "#[fg=#{@pill_datetime},bg=#{@thm_mantle}]"
set -agF status-right "#[fg=#{@thm_crust},bg=#{@pill_datetime}] %H:%M %Y-%m-%d "
set -agF status-right "#[fg=#{@pill_datetime},bg=#{@thm_mantle}]"
