# Dracula Pro tmux theme
# ~/.config/tmux/plugins/dracula-pro-tmux/dracula_pro.tmux
#
# FLAVOR
#   @dracula_pro_flavor  "pro" | "blade" | "buffy" | "lincoln" | "morbius" | "van_helsing" | "alucard"
#
# STATUS BAR
#   @dracula_pro_status_background   "default" | "none" | "<hex>"
#   @dracula_pro_status_left_separator    "<str>"   (default: "")
#   @dracula_pro_status_middle_separator  "<str>"   (default: "")
#   @dracula_pro_status_right_separator   "<str>"   (default: " ")
#   @dracula_pro_status_connect_separator "yes" | "no"
#   @dracula_pro_status_modules_right     "<module> ..."
#   @dracula_pro_status_module_text_bg    "<hex>"  (override module text bg)
#
# WINDOW STATUS
#   @dracula_pro_window_status_style        "basic" | "rounded" | "slanted" | "custom" | "none"
#   @dracula_pro_window_number_position     "left" | "right"
#   @dracula_pro_window_text                "<format>"   (default: " #T")
#   @dracula_pro_window_number              "<format>"   (default: "#I")
#   @dracula_pro_window_text_color          "<tmux color>"
#   @dracula_pro_window_number_color        "<tmux color>"
#   @dracula_pro_window_current_text        "<format>"   (default: " #T")
#   @dracula_pro_window_current_number      "<format>"   (default: "#I")
#   @dracula_pro_window_current_text_color  "<tmux color>"
#   @dracula_pro_window_current_number_color "<tmux color>"
#
# WINDOW FLAGS
#   @dracula_pro_window_flags               "none" | "icon" | "text"
#   @dracula_pro_window_flags_icon_last     "<str>"  (default: " 󰖰")
#   @dracula_pro_window_flags_icon_current  "<str>"  (default: " 󰖯")
#   @dracula_pro_window_flags_icon_zoom     "<str>"  (default: " 󰁌")
#   @dracula_pro_window_flags_icon_mark     "<str>"  (default: " 󰃀")
#   @dracula_pro_window_flags_icon_silent   "<str>"  (default: " 󰂛")
#   @dracula_pro_window_flags_icon_activity "<str>"  (default: " 󱅫")
#   @dracula_pro_window_flags_icon_bell     "<str>"  (default: " 󰂞")
#
# PANES
#   @dracula_pro_pane_status_enabled     "yes" | "no"
#   @dracula_pro_pane_border_status      "yes" | "no"
#   @dracula_pro_pane_border_style       "<tmux style>"
#   @dracula_pro_pane_active_border_style "<tmux style>"
#   @dracula_pro_pane_color              "<tmux color>"
#   @dracula_pro_pane_background_color   "<tmux color>"
#   @dracula_pro_pane_default_text       "<format>"
#   @dracula_pro_pane_default_fill       "number" | "all" | "none"
#   @dracula_pro_pane_number_position    "left" | "right"
#   @dracula_pro_pane_left_separator     "<str>"  (default: "█")
#   @dracula_pro_pane_middle_separator   "<str>"  (default: "█")
#   @dracula_pro_pane_right_separator    "<str>"  (default: "█")
#
# MENU (tmux >= 3.4)
#   @dracula_pro_menu_selected_style     "<tmux style>"
#
# AVAILABLE MODULES (for status_modules_right / _left)
#   application  battery  cpu  date_time  directory  gitmux  host
#   kube  load  pomodoro_plus  session  uptime  user  weather

#set -g @dracula_pro_flavor "pro"
set -g @dracula_pro_flavor "pro"

# Keep the status line readable and compact.
set -g @dracula_pro_window_status_style "rounded"
set -g @dracula_pro_status_background "default"
set -g @dracula_pro_status_left_separator ""
set -g @dracula_pro_status_right_separator ""

# Window tabs show the current process name, mapping version-named binaries (e.g. Claude) to friendly names.
set -g @dracula_pro_window_text " #{?#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"
set -g @dracula_pro_window_current_text " #{?#{m/r:^[0-9]+\\.[0-9]+\\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"

set -g status-left-length 100
set -g status-right-length 100

run ~/.config/tmux/plugins/dracula-pro-tmux/dracula_pro.tmux

# Semantic color aliases for status bar pills (change these to repaint all pills).
# Must be set after run so theme variables are available.
set -gF @pill_hostname  "#{@thm_green}"
set -gF @pill_username  "#{@thm_pink}"
set -gF @pill_session   "#{@thm_yellow}"
set -gF @pill_datetime  "#{@thm_mauve}"
